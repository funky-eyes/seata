name: protoc diagnostics

on:
  push:
    branches: [ codex/investigate-protoc-flake ]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    services:
      redis:
        image: redis:7.2
        ports: [ '6379:6379' ]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
      nacos:
        image: nacos/nacos-server:v2.4.2
        ports: [ '8848:8848', '9848:9848' ]
        env:
          MODE: standalone
          SPRING_SECURITY_ENABLED: false
        options: --health-cmd="curl -f http://localhost:8848/nacos" --health-interval=10s --health-timeout=5s --health-retries=3 --health-start-period=30s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3.12.0
        with:
          distribution: zulu
          java-version: '25'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            ${{ runner.os }}-maven-
      - name: Run the original Checkstyle preparation
        run: ./mvnw -T 4C -e -B clean checkstyle:check -Dcheckstyle.skip=false -Dcheckstyle.includes=
      - name: Trace the original Maven test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y strace
          strace -f --seccomp-bpf -qq -e trace=execve,execveat -s 512 -o "$RUNNER_TEMP/execve.trace" \
            ./mvnw -T 4C -fae clean test -Dlicense.skip=true \
            -DredisCaseEnabled=true -DnacosCaseEnabled=true \
            -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      - name: Inspect generator and execve results
        if: always()
        shell: bash
        run: |
          set +e
          echo '--- generator execve calls ---'
          grep -F 'protoc-gen-grpc-java' "$RUNNER_TEMP/execve.trace"
          echo '--- generated executable and cached artifact ---'
          for path in extensions/rpc/seata-grpc/target/protoc-plugins/protoc-gen-grpc-java-* "$HOME"/.m2/repository/io/grpc/protoc-gen-grpc-java/1.83.1/*linux-x86_64.exe; do
            [ -e "$path" ] || continue
            ls -l "$path"
            stat "$path"
            sha1sum "$path"
            file "$path"
            ldd "$path"
            namei -l "$path"
          done
          df -h .
          findmnt -T .
      - name: Repeat generator copy and execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          command -v strace >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y strace; }
          plugin_url=https://repo.maven.apache.org/maven2/io/grpc/protoc-gen-grpc-java/1.83.1/protoc-gen-grpc-java-1.83.1-linux-x86_64.exe
          protoc_url=https://repo.maven.apache.org/maven2/com/google/protobuf/protoc/3.25.9/protoc-3.25.9-linux-x86_64.exe
          curl --retry 4 --retry-all-errors -fsSL "$plugin_url" -o "$RUNNER_TEMP/grpc-source"
          curl --retry 4 --retry-all-errors -fsSL "$protoc_url" -o "$RUNNER_TEMP/protoc"
          echo '6d85303e20a69a8f1f51d61325d1a957ee6ae922  '"$RUNNER_TEMP/grpc-source" | sha1sum -c -
          chmod u+x "$RUNNER_TEMP/protoc"
          export DIAG_PLUGIN_SOURCE="$RUNNER_TEMP/grpc-source"
          export DIAG_PROTOC="$RUNNER_TEMP/protoc"
          export DIAG_PLUGIN_DIR="$GITHUB_WORKSPACE/extensions/rpc/seata-grpc/target/protoc-plugins"
          export DIAG_PROTO_DIR="$GITHUB_WORKSPACE/extensions/rpc/seata-grpc/src/test/proto"
          export DIAG_OUTPUT="$RUNNER_TEMP/generated"
          mkdir -p "$DIAG_PLUGIN_DIR" "$DIAG_OUTPUT"
          set +e
          strace -f --seccomp-bpf -qq -e trace=execve,execveat -s 512 -o "$RUNNER_TEMP/repeat.trace" bash -ec '
            plugin="$DIAG_PLUGIN_DIR/protoc-gen-grpc-java-1.83.1-linux-x86_64.exe"
            for iteration in $(seq 1 100); do
              rm -f "$plugin"
              cp "$DIAG_PLUGIN_SOURCE" "$plugin"
              chmod u+x "$plugin"
              "$DIAG_PROTOC" --proto_path="$DIAG_PROTO_DIR" --plugin=protoc-gen-grpc-java="$plugin" --grpc-java_out="$DIAG_OUTPUT" "$DIAG_PROTO_DIR/contextTest.proto"
            done
          '
          result=$?
          echo "Repeated generation exit status: $result"
          echo "Generator execve calls: $(grep -c 'execve(.*protoc-gen-grpc-java-1.83.1-linux-x86_64.exe' "$RUNNER_TEMP/repeat.trace")"
          grep -E 'execve\("[^"]*protoc-gen-grpc-java[^\"]*".*= -1' "$RUNNER_TEMP/repeat.trace" || true
          if [ "$result" -ne 0 ]; then
            ls -l "$DIAG_PLUGIN_DIR"
            stat "$DIAG_PLUGIN_DIR"/*
            sha1sum "$DIAG_PLUGIN_DIR"/*
            file "$DIAG_PLUGIN_DIR"/*
          fi
          exit "$result"
