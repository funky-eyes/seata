name: protoc fork race experiment

on:
  push:
    branches: [ codex/investigate-protoc-fork-race ]

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        launch: [ POSIX_SPAWN, FORK ]
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3.12.0
        with:
          distribution: zulu
          java-version: '25'
      - name: Trace Java copy and concurrent process launch
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y strace
          curl --retry 4 --retry-all-errors -fsSL https://repo.maven.apache.org/maven2/io/grpc/protoc-gen-grpc-java/1.83.1/protoc-gen-grpc-java-1.83.1-linux-x86_64.exe -o "$RUNNER_TEMP/grpc-source"
          curl --retry 4 --retry-all-errors -fsSL https://repo.maven.apache.org/maven2/com/google/protobuf/protoc/3.25.9/protoc-3.25.9-linux-x86_64.exe -o "$RUNNER_TEMP/protoc"
          echo '6d85303e20a69a8f1f51d61325d1a957ee6ae922  '"$RUNNER_TEMP/grpc-source" | sha1sum -c -
          chmod u+x "$RUNNER_TEMP/protoc"
          mkdir -p "$RUNNER_TEMP/classes" "$RUNNER_TEMP/generated" extensions/rpc/seata-grpc/target/protoc-plugins
          javac -d "$RUNNER_TEMP/classes" .github/diagnostics/ProtocForkRace.java
          plugin="$GITHUB_WORKSPACE/extensions/rpc/seata-grpc/target/protoc-plugins/protoc-gen-grpc-java-1.83.1-linux-x86_64.exe"
          set +e
          strace -f --seccomp-bpf -qq -e trace=execve,execveat -s 512 -o "$RUNNER_TEMP/fork.trace" \
            java -Djdk.lang.Process.launchMechanism=${{ matrix.launch }} -cp "$RUNNER_TEMP/classes" ProtocForkRace \
            "$RUNNER_TEMP/grpc-source" "$plugin" "$RUNNER_TEMP/protoc" \
            "$GITHUB_WORKSPACE/extensions/rpc/seata-grpc/src/test/proto" "$RUNNER_TEMP/generated"
          result=$?
          set -e
          echo "Experiment exit status: $result"
          echo "Generator execve calls: $(grep -Ec 'execve\("[^"]*/protoc-gen-grpc-java-1[.]83[.]1-linux-x86_64[.]exe"' "$RUNNER_TEMP/fork.trace" || true)"
          grep -E 'execve\("[^"]*protoc-gen-grpc-java[^\"]*".*= -1' "$RUNNER_TEMP/fork.trace" || true
          if [ "$result" -ne 0 ]; then
            ls -l "$plugin"
            stat "$plugin"
            sha1sum "$plugin"
          fi
          exit "$result"
