name: "build"

on:
  push:
    branches: [ 2.x, develop, master ]
  pull_request:
    branches: [ 2.x, develop, master ]
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  SEATA_PREVIOUS_RAFT_VERSION: 2.6.0
  SEATA_PREVIOUS_RAFT_SERVER_ARCHIVE_URL: https://archive.apache.org/dist/incubator/seata/2.6.0/apache-seata-2.6.0-incubating-bin.tar.gz

jobs:
  raft-changes:
    name: "raft-changes"
    runs-on: ubuntu-latest
    outputs:
      raft: ${{ steps.filter.outputs.raft }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
      - name: "Detect raft-related changes"
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            raft:
              - 'server/**'
              - 'discovery/**'
              - 'distribution/**'
              - 'test-suite/**'
              - 'script/**'
              - '.github/workflows/**'

  # job 1: Test based on java 8, 17, 21 and 25.
  build:
    name: "build"
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
      nacos:
        image: nacos/nacos-server:v2.4.2
        ports:
          - 8848:8848
        env:
          MODE: standalone
          SPRING_SECURITY_ENABLED: false
        options: --health-cmd="curl -f http://localhost:8848/nacos" --health-interval=10s --health-timeout=5s --health-retries=3 --health-start-period=30s
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 17, 21, 25 ]
    steps:
      # step 1
      - name: "Checkout"
        uses: actions/checkout@v3
      # step 2
      - name: "Use Python 3.x"
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'
      # step 3
      - name: "Set up Java JDK"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
      # step 4
      - name: "Print maven version"
        run: ./mvnw -version
      # step 5
      - name: "Restore local maven repository cache"
        uses: actions/cache/restore@v4
        id: cache-maven-repository
        with:
         path: ~/.m2/repository
         key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ env.TODAY }}
         restore-keys: |
           ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
           ${{ runner.os }}-maven-
      # step 6.1
      - name: "Test, Check PMD, Check license with Maven and Java8"
        if: matrix.java == '8'
        run: |
          ./mvnw -T 4C clean test \
                 -Dpmd.skip=false -Dlicense.skip=false -DredisCaseEnabled=true -DnacosCaseEnabled=true \
                 -e -B \
                 -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn \
                 -Dorg.slf4j.simpleLogger.log.net.sourceforge.pmd=info \
                 2>&1 | tee build.log | while read line; do
                   echo "$line"
                   if [[ "$line" == *"PMD Failure"* ]]; then
                     echo "::error::PMD Violations Detected! Check Details Above!"
                   fi
                 done
          exit_code=${PIPESTATUS[0]}
          exit $exit_code
      # step 6.2
      - name: "Test with Maven and Java${{ matrix.java }}"
        if: matrix.java != '8'
        run: |
          ./mvnw -T 4C clean test \
                 -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn;
      # step 7
      - name: "Save local maven repository cache"
        uses: actions/cache/save@v4
        if: steps.cache-maven-repository.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ env.TODAY }}
      # step 8
      - name: "Codecov"
        if: matrix.java == '8'
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v0.6.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # job 2: Build and Release on 'arm64v8/ubuntu' OS (Skip tests).
  build_arm64-binary:
    runs-on: ubuntu-24.04-arm
    if: ${{ github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'snapshot' || github.ref_name == '2.x') }}
    strategy:
      fail-fast: false
    steps:
      # step 1
      - name: "Checkout"
        uses: actions/checkout@v3
      # step 2
      - name: "Set up Java JDK 25"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: 25
      # step 4
      - name: "Print maven version"
        run: ./mvnw -version
      # step 3
      - name: "Build with Maven on 'ubuntu:24.04-arm' OS (Skip tests)"
        run: |
          ./mvnw -T 4C clean install \
              -Prelease-seata \
              -DskipTests \
              -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

  raft-current-server-current-client:
    name: "raft-current-server-current-client"
    runs-on: ubuntu-latest
    needs: raft-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.raft-changes.outputs.raft == 'true' }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
      - name: "Set up Java JDK 17"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'maven'
      - name: "Prepare scripts"
        run: chmod +x ./script/ci/raft-cluster.sh
      - name: "Build current server-only distribution"
        run: |
          ./mvnw -pl distribution -am -Prelease-seata-server -DskipTests package \
                 -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
          echo "SEATA_CURRENT_SERVER_ARCHIVE=$(ls distribution/target/apache-seata-server-*-bin.tar.gz | head -n 1)" >> "$GITHUB_ENV"
      - name: "Start current raft cluster"
        run: |
          ./script/ci/raft-cluster.sh start \
            --distribution "$SEATA_CURRENT_SERVER_ARCHIVE" \
            --workspace "$RUNNER_TEMP/raft-current-server-current-client" \
            --env-file "$GITHUB_ENV"
      - name: "Run current client raft compatibility test"
        run: |
          ./mvnw -pl test-suite/test-new-version -am \
                 -Dtest=ExternalRaftClusterIT test \
                 -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      - name: "Stop current raft cluster"
        if: always()
        run: ./script/ci/raft-cluster.sh stop --workspace "$SEATA_RAFT_WORKSPACE"
      - name: "Upload current/current raft logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raft-current-server-current-client-logs
          path: ${{ env.SEATA_RAFT_WORKSPACE }}
          if-no-files-found: ignore

  raft-previous-server-current-client:
    name: "raft-previous-server-current-client"
    runs-on: ubuntu-latest
    needs: raft-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.raft-changes.outputs.raft == 'true' }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
      - name: "Set up Java JDK 17"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'maven'
      - name: "Prepare scripts"
        run: chmod +x ./script/ci/raft-cluster.sh
      - name: "Start previous stable raft cluster"
        run: |
          ./script/ci/raft-cluster.sh start \
            --distribution "$SEATA_PREVIOUS_RAFT_SERVER_ARCHIVE_URL" \
            --workspace "$RUNNER_TEMP/raft-previous-server-current-client" \
            --env-file "$GITHUB_ENV"
      - name: "Run current client against previous raft server"
        run: |
          ./mvnw -pl test-suite/test-new-version -am \
                 -Dtest=ExternalRaftClusterIT test \
                 -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      - name: "Stop previous raft cluster"
        if: always()
        run: ./script/ci/raft-cluster.sh stop --workspace "$SEATA_RAFT_WORKSPACE"
      - name: "Upload previous/current raft logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raft-previous-server-current-client-logs
          path: ${{ env.SEATA_RAFT_WORKSPACE }}
          if-no-files-found: ignore

  raft-current-server-previous-client:
    name: "raft-current-server-previous-client"
    runs-on: ubuntu-latest
    needs: raft-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.raft-changes.outputs.raft == 'true' }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
      - name: "Set up Java JDK 17"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'maven'
      - name: "Prepare scripts"
        run: chmod +x ./script/ci/raft-cluster.sh
      - name: "Build current server-only distribution"
        run: |
          ./mvnw -pl distribution -am -Prelease-seata-server -DskipTests package \
                 -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
          echo "SEATA_CURRENT_SERVER_ARCHIVE=$(ls distribution/target/apache-seata-server-*-bin.tar.gz | head -n 1)" >> "$GITHUB_ENV"
      - name: "Start current raft cluster"
        run: |
          ./script/ci/raft-cluster.sh start \
            --distribution "$SEATA_CURRENT_SERVER_ARCHIVE" \
            --workspace "$RUNNER_TEMP/raft-current-server-previous-client" \
            --env-file "$GITHUB_ENV"
      - name: "Run previous stable client against current raft server"
        run: |
          ./mvnw -pl test-suite/test-previous-version -am \
                 -Dtest=PreviousVersionRaftCompatibilityIT test \
                 -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      - name: "Stop current raft cluster"
        if: always()
        run: ./script/ci/raft-cluster.sh stop --workspace "$SEATA_RAFT_WORKSPACE"
      - name: "Upload current/previous raft logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raft-current-server-previous-client-logs
          path: ${{ env.SEATA_RAFT_WORKSPACE }}
          if-no-files-found: ignore
