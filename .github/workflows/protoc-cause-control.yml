name: protoc cause control

on:
  push:
    branches: [ codex/investigate-protoc-control ]

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare controlled execve failures
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y strace
          plugin="$RUNNER_TEMP/protoc-gen-grpc-java"
          protoc="$RUNNER_TEMP/protoc"
          proto_dir="$GITHUB_WORKSPACE/extensions/rpc/seata-grpc/src/test/proto"
          output="$RUNNER_TEMP/out"
          mkdir -p "$output"
          curl --retry 4 --retry-all-errors -fsSL https://repo.maven.apache.org/maven2/io/grpc/protoc-gen-grpc-java/1.83.1/protoc-gen-grpc-java-1.83.1-linux-x86_64.exe -o "$plugin"
          curl --retry 4 --retry-all-errors -fsSL https://repo.maven.apache.org/maven2/com/google/protobuf/protoc/3.25.9/protoc-3.25.9-linux-x86_64.exe -o "$protoc"
          echo '6d85303e20a69a8f1f51d61325d1a957ee6ae922  '"$plugin" | sha1sum -c -
          chmod u+x "$plugin" "$protoc"
          "$protoc" --proto_path="$proto_dir" --plugin=protoc-gen-grpc-java="$plugin" --grpc-java_out="$output" "$proto_dir/contextTest.proto"
          echo 'Control 1: deliberately hold the generator open for writing.'
          exec 9<>"$plugin"
          set +e
          strace -f -qq -e trace=execve -s 512 -o "$RUNNER_TEMP/busy.trace" "$protoc" --proto_path="$proto_dir" --plugin=protoc-gen-grpc-java="$plugin" --grpc-java_out="$output" "$proto_dir/contextTest.proto" 2>"$RUNNER_TEMP/busy.stderr"
          busy_result=$?
          exec 9>&-
          set -e
          cat "$RUNNER_TEMP/busy.stderr"
          grep -F 'ETXTBSY' "$RUNNER_TEMP/busy.trace"
          test "$busy_result" -ne 0
          grep -F 'program not found or is not executable' "$RUNNER_TEMP/busy.stderr"
          echo 'Control 2: deliberately remove executable permission.'
          chmod u-x "$plugin"
          set +e
          strace -f -qq -e trace=execve -s 512 -o "$RUNNER_TEMP/denied.trace" "$protoc" --proto_path="$proto_dir" --plugin=protoc-gen-grpc-java="$plugin" --grpc-java_out="$output" "$proto_dir/contextTest.proto" 2>"$RUNNER_TEMP/denied.stderr"
          denied_result=$?
          set -e
          cat "$RUNNER_TEMP/denied.stderr"
          grep -F 'EACCES' "$RUNNER_TEMP/denied.trace"
          test "$denied_result" -ne 0
          grep -F 'program not found or is not executable' "$RUNNER_TEMP/denied.stderr"
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Repeat copy and execution under CPU load
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y strace
          curl --retry 4 --retry-all-errors -fsSL https://repo.maven.apache.org/maven2/io/grpc/protoc-gen-grpc-java/1.83.1/protoc-gen-grpc-java-1.83.1-linux-x86_64.exe -o "$RUNNER_TEMP/grpc-source"
          curl --retry 4 --retry-all-errors -fsSL https://repo.maven.apache.org/maven2/com/google/protobuf/protoc/3.25.9/protoc-3.25.9-linux-x86_64.exe -o "$RUNNER_TEMP/protoc"
          echo '6d85303e20a69a8f1f51d61325d1a957ee6ae922  '"$RUNNER_TEMP/grpc-source" | sha1sum -c -
          chmod u+x "$RUNNER_TEMP/protoc"
          export DIAG_SOURCE="$RUNNER_TEMP/grpc-source"
          export DIAG_PROTOC="$RUNNER_TEMP/protoc"
          export DIAG_DIR="$GITHUB_WORKSPACE/extensions/rpc/seata-grpc/target/protoc-plugins"
          export DIAG_PROTO_DIR="$GITHUB_WORKSPACE/extensions/rpc/seata-grpc/src/test/proto"
          export DIAG_OUTPUT="$RUNNER_TEMP/generated"
          mkdir -p "$DIAG_DIR" "$DIAG_OUTPUT"
          yes >/dev/null & load1=$!
          yes >/dev/null & load2=$!
          trap 'kill "$load1" "$load2" 2>/dev/null || true' EXIT
          set +e
          strace -f --seccomp-bpf -qq -e trace=execve,execveat -s 512 -o "$RUNNER_TEMP/repeat.trace" bash -ec '
            plugin="$DIAG_DIR/protoc-gen-grpc-java-1.83.1-linux-x86_64.exe"
            for iteration in $(seq 1 100); do
              rm -f "$plugin"
              cp "$DIAG_SOURCE" "$plugin"
              chmod u+x "$plugin"
              "$DIAG_PROTOC" --proto_path="$DIAG_PROTO_DIR" --plugin=protoc-gen-grpc-java="$plugin" --grpc-java_out="$DIAG_OUTPUT" "$DIAG_PROTO_DIR/contextTest.proto"
            done
          '
          result=$?
          set -e
          echo "Repeated generation exit status: $result"
          echo "Generator execve calls: $(grep -Ec 'execve\("[^"]*/protoc-gen-grpc-java-1[.]83[.]1-linux-x86_64[.]exe"' "$RUNNER_TEMP/repeat.trace" || true)"
          grep -E 'execve\("[^"]*protoc-gen-grpc-java[^\"]*".*= -1' "$RUNNER_TEMP/repeat.trace" || true
          if [ "$result" -ne 0 ]; then
            ls -l "$DIAG_DIR"
            stat "$DIAG_DIR"/*
            sha1sum "$DIAG_DIR"/*
          fi
          exit "$result"
