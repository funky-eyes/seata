name: Correct release JDK range

on:
  push:
    branches:
      - fix/2.7.0-release-compliance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2.7.0-release-compliance
      - name: Correct release JDK requirement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/pom.xml')
          s = p.read_text()
          old = '''                                            <version>[21,25)</version>\n                                            <message>Release deployment requires JDK 21-24 so seata-threadpool-loom and json-common-jackson3 are included while JDK25-only application modules remain excluded.</message>'''
          new = '''                                            <version>[21,)</version>\n                                            <message>Release deployment requires JDK 21 or later so seata-threadpool-loom and json-common-jackson3 are included in Maven staging.</message>'''
          if old not in s:
              raise SystemExit('expected release JDK guard not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-release-jdk-range.yml
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/pom.xml .github/workflows/fix-release-jdk-range.yml
          git commit -m "fix: allow JDK 21+ for release staging"
          git push origin HEAD:fix/2.7.0-release-compliance