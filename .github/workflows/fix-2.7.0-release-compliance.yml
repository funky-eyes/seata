name: Apply 2.7.0 release compliance fixes

on:
  push:
    branches:
      - fix/2.7.0-release-compliance

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply release compliance fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # The Apache License 2.0 definition must be verbatim.
          for name in [
              'LICENSE',
              'distribution/LICENSE',
              'distribution/LICENSE-server',
              'distribution/LICENSE-namingserver',
          ]:
              p = Path(name)
              text = p.read_text()
              bad = '"control" means (properties) the power, direct or indirect, to cause the'
              good = '"control" means (i) the power, direct or indirect, to cause the'
              if bad not in text:
                  raise SystemExit(f'{name}: malformed Apache License marker not found')
              p.write_text(text.replace(bad, good, 1))

          # Restore the original Bootstrap v3.0.3 copyright/license banner.
          p = Path('console/src/main/resources/static/console-fe/public/css/bootstrap.css')
          text = p.read_text()
          asf_header = '''/*
           * Licensed to the Apache Software Foundation (ASF) under one or more
           * contributor license agreements.  See the NOTICE file distributed with
           * this work for additional information regarding copyright ownership.
           * The ASF licenses this file to You under the Apache License, Version 2.0
           * (the "License"); you may not use this file except in compliance with
           * the License.  You may obtain a copy of the License at
           *
           *     http://www.apache.org/licenses/LICENSE-2.0
           *
           * Unless required by applicable law or agreed to in writing, software
           * distributed under the License is distributed on an "AS IS" BASIS,
           * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
           * See the License for the specific language governing permissions and
           * limitations under the License.
           */'''
          bootstrap_header = '''/*!
           * Bootstrap v3.0.3 (http://getbootstrap.com)
           * Copyright 2013 Twitter, Inc.
           * Licensed under http://www.apache.org/licenses/LICENSE-2.0
           */'''
          if not text.startswith(asf_header):
              raise SystemExit('bootstrap.css: expected ASF replacement header not found')
          p.write_text(bootstrap_header + text[len(asf_header):])

          # Put LICENSE and NOTICE back at the binary archive root while retaining
          # the component-specific copies under seata-server/ and seata-namingserver/.
          p = Path('distribution/release-seata.xml')
          text = p.read_text()
          marker = '''        <file>
                      <source>LICENSE-server</source>'''
          root_files = '''        <file>
                      <source>../LICENSE</source>
                      <destName>LICENSE</destName>
                  </file>
                  <file>
                      <source>../NOTICE</source>
                      <destName>NOTICE</destName>
                  </file>
          '''
          if marker not in text:
              raise SystemExit('release-seata.xml: LICENSE-server marker not found')
          p.write_text(text.replace(marker, root_files + marker, 1))
          PY

          # Remove this one-shot helper from the resulting branch history tip.
          git rm .github/workflows/fix-2.7.0-release-compliance.yml

          # Static assertions for every release blocker fixed here.
          grep -q '"control" means (i) the power' LICENSE
          grep -q '"control" means (i) the power' distribution/LICENSE
          grep -q 'Copyright 2013 Twitter, Inc.' console/src/main/resources/static/console-fe/public/css/bootstrap.css
          grep -q '<source>../LICENSE</source>' distribution/release-seata.xml
          grep -q '<source>../NOTICE</source>' distribution/release-seata.xml

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LICENSE distribution/LICENSE distribution/LICENSE-server distribution/LICENSE-namingserver \
            console/src/main/resources/static/console-fe/public/css/bootstrap.css distribution/release-seata.xml
          git commit -m 'fix: address 2.7.0 release compliance blockers'
          git push origin HEAD:fix/2.7.0-release-compliance
